name: Pipeline MTSS

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: roman-number

    steps:
      # Scarica il codice sorgente dal repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configura l'ambiente Java 17
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Compilazione del progetto
      # Fallisce se ci sono errori di compilazione
      - name: Compilazione
        run: mvn compile

      # Esecuzione dei test (fase: test)
      # Fallisce se uno o più test non passano
      - name: Esecuzione Test
        run: mvn test

      # Analisi statica del codice
      # Fallisce se ci sono violazioni di stile
      - name: Analisi Statica del Codice
        run: mvn checkstyle:check

      # Generazione report JaCoCo
      - name: Generazione Coverage Report
        run: mvn jacoco:report

      # Invio report a Coveralls
      - name: Invio a Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: roman-number/target/site/jacoco/jacoco.xml
          format: jacoco